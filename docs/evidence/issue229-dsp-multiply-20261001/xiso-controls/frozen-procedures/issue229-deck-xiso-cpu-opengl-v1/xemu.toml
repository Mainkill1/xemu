[general]
show_welcome = false
[input]
background_input_capture = true
[input.virtual_ports]
port1_connected = 1
[input.bindings]
port1_driver = "usb-xbox-gamepad"
port1 = "keyboard"
[display]
renderer = "OPENGL"
[display.window]
vsync = false
[audio]
use_dsp = false
use_dsp_jit = true
[sys]
mem_limit = "128"
[sys.files]
hdd_path = "{runtimeDir}/hdd.qcow2"
eeprom_path = "{runtimeDir}/eeprom.bin"
