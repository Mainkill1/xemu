[general]
show_welcome = false
skip_boot_anim = false
[input]
auto_bind = false
background_input_capture = true
[input.bindings]
port1_driver = 'usb-xbox-gamepad'
port1 = 'keyboard'
[display]
renderer = 'VULKAN'
[display.window]
startup_size = '1280x720'
vsync = false
[audio]
use_dsp_jit = true
[sys]
mem_limit = '64'
[sys.files]
bootrom_path = ''
flashrom_path = ''
eeprom_path = '{runtimeDir}/eeprom.bin'
hdd_path = '{runtimeDir}/hdd.qcow2'
dvd_path = ''
[perf]
cache_shaders = false
