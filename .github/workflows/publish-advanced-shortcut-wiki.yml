name: Publish advanced shortcut testing wiki

on:
  push:
    branches:
      - main
    paths:
      - .github/wiki-advanced-shortcuts-staging/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Publish planned testing page
        shell: bash
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_page="source/.github/wiki-advanced-shortcuts-staging/Advanced-Shortcut-Planned-Testing.md"
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          test -f "${source_page}"
          git clone "${wiki_url}" wiki
          cp "${source_page}" "wiki/Advanced-Shortcut-Planned-Testing.md"

          home="wiki/Home.md"
          touch "${home}"

          if ! grep -qF "Advanced-Shortcut-Planned-Testing" "${home}"; then
            printf '\n## Advanced shortcut planning\n\n' >> "${home}"
            printf '%s\n' '- [[Advanced Shortcut Planned Testing|Advanced-Shortcut-Planned-Testing]] — planned implementation, maintained reference routes, and qualification requirements for Advanced performance controls.' >> "${home}"
          fi

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Advanced-Shortcut-Planned-Testing.md Home.md

          if git diff --cached --quiet; then
            echo "Wiki already matches the staged page."
            exit 0
          fi

          git commit -m "docs: publish advanced shortcut planned testing"
          git push origin HEAD
