          old_order = ('A08/A09 repeated preparation and C02 dirty-TLB metadata. '
                       '**Model ownership first:**')
          new_order = ('A08/A09 repeated preparation, C02 dirty-TLB metadata and C04 PFIFO/PGRAPH handoff attribution. '
                       '**Model ownership first:**')
          if old_order in index:
              index = index.replace(old_order, new_order, 1)
          
          sidebar_link = ('- [C04 — PFIFO/PGRAPH dispatch handoffs]'
                          '(https://github.com/Mainkill1/xemu/wiki/Performance-Research-C04-PFIFO-PGRAPH-Dispatch-Handoffs#research-c04)')
          if sidebar_link not in sidebar:
              marker = '<!-- xemu-research:2026-09-15:SIDEBAR:end -->'
              if marker not in sidebar:
                  raise SystemExit('Sidebar managed marker is missing')
              sidebar = sidebar.replace(marker, sidebar_link + '\n' + marker, 1)
          
          index_path.write_text(index, encoding='utf-8')
          sidebar_path.write_text(sidebar, encoding='utf-8')
          
          all_text = '\n'.join(p.read_text(encoding='utf-8') for p in wiki.glob('*.md'))
          checks = {
              'page begin marker': all_text.count('<!-- xemu-research:2026-09-15:C04:begin -->') == 1,
              'page end marker': all_text.count('<!-- xemu-research:2026-09-15:C04:end -->') == 1,
              'index link': index.count('#research-c04') == 1,
              'sidebar link': sidebar.count('#research-c04') == 1,
              'workstream count': 'preserves 27 workstreams' in index,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('validation failed: ' + ', '.join(failed))
          print('validated C04 page, index row, sidebar link, and 27-workstream count')
          PYTHON_UPDATER

          python3 /tmp/update_wiki_c04.py wiki /tmp/C04.md
          python3 /tmp/update_wiki_c04.py wiki /tmp/C04.md
          git -C wiki diff --check

          python3 - <<'PYTHON_VALIDATE'
          from pathlib import Path

          wiki = Path('wiki')
          page = wiki / 'Performance-Research-C04-PFIFO-PGRAPH-Dispatch-Handoffs.md'
          index = (wiki / 'Performance-Unproven.md').read_text(encoding='utf-8')
          sidebar = (wiki / '_Sidebar.md').read_text(encoding='utf-8')
          text = page.read_text(encoding='utf-8')

          required = [
              '## Why this vector merits measurement',
              '## Phase 0 — attribution before behavior changes',
              '## Recommended first code change: behavior-preserving handoff helper',
              '## Phase 1 candidate — bounded safe dispatch epoch',
              '## Files to change',
              '## Focused tests',
              '## Acceptance and rejection criteria',
          ]
          missing = [heading for heading in required if heading not in text]
          if missing:
              raise SystemExit(f'missing required C04 sections: {missing}')
          if text.count('<!-- xemu-research:2026-09-15:C04:begin -->') != 1:
              raise SystemExit('C04 begin marker is missing or duplicated')
          if text.count('<!-- xemu-research:2026-09-15:C04:end -->') != 1:
              raise SystemExit('C04 end marker is missing or duplicated')
          if index.count('#research-c04') != 1:
              raise SystemExit('C04 index link is missing or duplicated')
          if sidebar.count('#research-c04') != 1:
              raise SystemExit('C04 sidebar link is missing or duplicated')
          if 'preserves 27 workstreams' not in index:
              raise SystemExit('index workstream count was not updated')
          print(f'validated C04 page: {len(text.splitlines())} lines, {len(text.encode())} bytes')
          PYTHON_VALIDATE

          git -C wiki status --short
          git -C wiki diff --stat

      - name: Commit, push, and verify wiki
        shell: bash
        run: |
          set -euo pipefail
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add -- '*.md'

          if git -C wiki diff --cached --quiet; then
            echo "Wiki already contains the C04 research page and navigation."
          else
            git -C wiki diff --cached --check
            git -C wiki diff --cached --stat
            git -C wiki commit -m "docs: add PFIFO PGRAPH dispatch research"
            git -C wiki push origin HEAD
          fi

          local_head="$(git -C wiki rev-parse HEAD)"
          remote_head="$(git -C wiki ls-remote origin HEAD | awk '{print $1}')"
          test -n "$remote_head"
          test "$local_head" = "$remote_head"
          test -z "$(git -C wiki status --porcelain)"
          echo "WIKI_COMMIT=$local_head"
          echo "WIKI_REMOTE_HEAD=$remote_head"
