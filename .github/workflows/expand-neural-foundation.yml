name: Expand neural foundation bootstrap

on:
  push:
    branches:
      - feature/dlss5-neural-presentation-foundation

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and expand implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/neural-foundation-bootstrap/part-* > /tmp/xemu-neural-foundation.b64
          base64 --decode /tmp/xemu-neural-foundation.b64 > /tmp/xemu-neural-foundation.tar.gz
          echo "b47adfeee3005181e2122ff16484ed49023b7643128f1c4c312bbdbbefa832e1  /tmp/xemu-neural-foundation.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/xemu-neural-foundation.tar.gz
          rm -rf .github/neural-foundation-bootstrap
          rm .github/workflows/expand-neural-foundation.yml
          git diff --check

      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "nv2a: Expand neural presentation implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
