name: Issue 86 qualification

on:
  push:
    branches:
      - research/issue86-report-latency

jobs:
  unit:
    name: Vulkan report lifecycle test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: |
          sudo apt-get -qy update
          sudo apt-get -qy build-dep .
      - run: ./configure --target-list=i386-softmmu --disable-werror
      - run: ninja -C build tests/unit/test-xbox-pgraph-vk-reports
      - run: build/tests/unit/test-xbox-pgraph-vk-reports

  source:
    name: Package exact source
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - run: sudo apt-get -qy install meson zstd
      - id: version
        run: |
          short_hash=$(git rev-parse --short HEAD)
          echo "pkg_version=0.0.0-0-unofficial-${short_hash}" >> "$GITHUB_OUTPUT"
      - run: |
          pkg_name="xemu-${{ steps.version.outputs.pkg_version }}"
          tar_filename="${pkg_name}.tar"
          tar_prefix="./${pkg_name}/"
          ./scripts/archive-source.sh "$tar_filename" "$tar_prefix"
          git rev-parse HEAD | tr -d '\n' > XEMU_COMMIT
          printf '%s' '${{ steps.version.outputs.pkg_version }}' > XEMU_VERSION
          tar -r --file "$tar_filename" --transform "s,^./,${tar_prefix}," \
            ./XEMU_COMMIT ./XEMU_VERSION
          zstd "$tar_filename"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: issue86-src
          path: xemu-${{ steps.version.outputs.pkg_version }}.tar.zst
          compression-level: 0

  win64:
    name: Optimized Win64 diagnostic
    needs: [unit, source]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-2881edd
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-ccache
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: issue86-src
      - run: |
          apt-get update
          apt-get install -qy curl
          tar -xf xemu-${{ needs.source.outputs.pkg_version }}.tar.zst \
            --strip-components=2
          mkdir -p "$CCACHE_DIR" "$LTO_CACHE_DIR"
      - run: |
          ./build.sh -p win64-cross \
            --extra-cflags="-flto-incremental=${LTO_CACHE_DIR} -flto-partition=cache" \
            -Db_lto=true -Dx86_version=3
      - run: |
          sha256sum dist/xemu.exe > dist/SHA256SUMS.txt
          git_head=$(cat XEMU_COMMIT)
          printf 'Source: %s\nProfile: Win64 Release, full LTO, x86-64-v3\n' \
            "$git_head" > dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: issue86-win64-${{ github.sha }}
          path: dist
